<style>
/* Düzen: gece stadyumu. Üstte skor şeridi, ortada 2:1 saha, altta parmak kontrolleri.
   Kariyer, antrenman ve sonuç ekranları sahanın üstüne açılan paneller. */
:root{
  --bg:#08130e;
  --panel:#10211a;
  --card:#162b21;
  --line:#2b4a3a;
  --fg:#eaf3ec;
  --mut:#8fae9d;
  --accent:#ffb627;
  --hot:#ff5a36;
  --good:#4ade80;
  --bad:#ff6b6b;
  --f-disp:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;
  overflow:hidden;position:relative;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
button{font-family:inherit;color:inherit}
#app{
  height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px;
}
#hud{
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  padding:4px 0 6px;min-height:58px;
}
#hud[hidden]{display:none}
.side{min-width:0}
.side.r{text-align:right}
.tname{font-family:var(--f-disp);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:#0c1914;border:1px solid var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:100%;background:var(--good);transition:width .12s linear}
.side.r .bar i{margin-left:auto;background:var(--hot)}
.mid{text-align:center;line-height:1}
#score{font-family:var(--f-disp);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#clock{font-family:var(--f-disp);font-weight:500;font-size:13px;color:var(--accent);letter-spacing:.1em;font-variant-numeric:tabular-nums;margin-top:3px}
#pauseBtn{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(8,19,14,.6);display:flex;align-items:center;justify-content:center;gap:5px;z-index:2}
#pauseBtn[hidden]{display:none}
#pauseBtn i{display:block;width:5px;height:16px;border-radius:2px;background:var(--fg)}
#view{flex:1;min-height:0;position:relative}
#cv{position:absolute;display:block;border-radius:6px;background:#0a1511}
#banner{
  position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;
  font-family:var(--f-disp);font-weight:700;font-size:clamp(44px,13vw,110px);line-height:1;
  color:var(--accent);text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 40px rgba(255,182,39,.35);
  letter-spacing:.04em;opacity:0;text-transform:uppercase;
}
#banner.show{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.08)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
#banner.hold{animation:none;opacity:1}
#pad{
  position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  pointer-events:none;padding-bottom:6px;gap:8px;
}
#pad[hidden]{display:none}
.grp{display:flex;gap:10px;align-items:flex-end}
.pb{
  pointer-events:auto;width:76px;height:76px;border-radius:22px;border:2px solid rgba(255,255,255,.28);
  background:rgba(16,33,26,.72);color:var(--fg);font-family:var(--f-disp);font-weight:500;font-size:15px;

}
.pb.dir{font-size:30px}
.pb.on{background:rgba(255,182,39,.55);border-color:var(--accent);transform:scale(.95)}
.pb.k{border-color:rgba(255,182,39,.7)}
.pb.h{border-color:rgba(255,90,54,.8)}
.pb.big{width:88px;height:88px}
@media (hover:hover) and (pointer:fine){#pad{display:none}}

/* paneller */

.up .n{font-family:var(--f-disp);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}

.pips{display:flex;gap:4px;grid-column:1/-1}
.pips i{flex:1;height:7px;border-radius:3px;background:#0c1914;border:1px solid var(--line)}
.pips i.f{background:var(--accent);border-color:var(--accent)}
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.res .big{font-family:var(--f-disp);font-weight:700;font-size:clamp(54px,18vw,84px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.res .win{color:var(--good)}.res .lose{color:var(--bad)}.res .draw{color:var(--accent)}
.stars{font-size:34px;letter-spacing:.2em;color:var(--accent)}
.stars s{text-decoration:none;color:#35503f}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:17px}
.sum span:nth-child(even){font-family:var(--f-disp);font-weight:500;color:var(--accent);text-align:right}
.hint{color:var(--mut);font-size:14px;line-height:1.4;margin:0}
.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:14px;padding:8px 0}

input{-webkit-user-select:text;user-select:text;touch-action:auto}

function mkP(side,st,col,name){
  return {side,face:side==='L'?1:-1,x:side==='L'?W*.3:W*.7,y:GY,vx:0,vy:0,onG:true,
    hp:st.hp,maxHp:st.hp,spd:st.spd,kickP:st.kick,jump:st.jump,dmg:st.hit,col,name,
    in:{l:0,r:0,j:0},wantKick:0,wantHit:0,kickT:0,hitT:0,kickDone:false,hitDone:false,hitCd:0,
    ragT:0,rag:null,inv:0,walk:0,ai:null,sup:0,skillCd:0,dash:0,wantSkill:0,slide:0,slideCd:0,slideDone:false,wantSlide:0,noCarry:0,charging:0,charge:0,shotC:null,bf:{spd:0,pow:0,frz:0,shd:0,stun:0,mag:0,jmp:0}};
}
const sw=(t,D)=>t>0?Math.sin((1-t/D)*Math.PI):0;

function limb(ax,ay,bx,by,l1,l2,bend){
  let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);
  const m=l1+l2-0.5;
  if(d>m){const s=m/d;dx*=s;dy*=s;d=m;bx=ax+dx;by=ay+dy}
  if(d<1)d=1;
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return {mid:{x:ax+dx*a/d+(-dy/d)*h*bend,y:ay+dy*a/d+(dx/d)*h*bend},end:{x:bx,y:by}};
}
function pose(p){
  const f=p.face,x=p.x,y=p.y,ph=p.walk,air=!p.onG;
  if(p.slide>0)return{head:{x:x-f*30,y:y-28},neck:{x:x-f*18,y:y-24},hip:{x:x-f*2,y:y-12},kL:{x:x+f*14,y:y-12},fL:{x:x+f*34,y:y-8},kR:{x:x+f*18,y:y-8},fR:{x:x+f*42,y:y-5},eL:{x:x-f*24,y:y-12},hL:{x:x-f*30,y:y-4},eR:{x:x-f*8,y:y-14},hR:{x:x-f*2,y:y-5}};
  const amt=air?0:clamp(Math.abs(p.vx)/110,0,1);
  const hipY=y-44-(air?0:Math.abs(Math.sin(ph))*2.5*amt);
  const hip={x,y:hipY};
  const sk=sw(p.kickT,KD),sh=sw(p.hitT,HD);
  const lean=clamp(p.vx/260,-1,1)*5+f*sh*6-f*sk*4;
  const neck={x:x+lean,y:hipY-32};
  const head={x:neck.x+f*2+lean*.3,y:neck.y-15};
  let flx,fly,frx,fry;
  if(air){
    flx=x+f*10;fly=y-14-clamp(-p.vy/90,-5,9);frx=x-f*9;fry=y-22;
  }else{
    flx=x-7+Math.sin(ph)*15*amt;fly=y-Math.max(0,Math.cos(ph))*8*amt;
    frx=x+7-Math.sin(ph)*15*amt;fry=y-Math.max(0,-Math.cos(ph))*8*amt;
  }
  if(p.kickT>0){frx=x+f*(8+40*sk);fry=y-12-32*sk;}
  let hlx=neck.x-f*4-Math.sin(ph)*13*amt,hly=neck.y+30-Math.abs(Math.sin(ph))*2*amt;
  let hrx=neck.x-f*2+Math.sin(ph)*13*amt,hry=neck.y+30;
  if(air){hlx=neck.x-f*10;hly=neck.y+22;hrx=neck.x+f*8;hry=neck.y+20}
  if(p.hitT>0){hrx=neck.x+f*(10+36*sh);hry=neck.y+10;hlx=neck.x+f*12;hly=neck.y+18}
  const kL=limb(hip.x,hip.y,flx,fly,22,22,-f),kR=limb(hip.x,hip.y,frx,fry,22,22,-f);
  const eL=limb(neck.x,neck.y,hlx,hly,17,17,f),eR=limb(neck.x,neck.y,hrx,hry,17,17,f);
  return {head,neck,hip,kL:kL.mid,fL:kL.end,kR:kR.mid,fR:kR.end,eL:eL.mid,hL:eL.end,eR:eR.mid,hR:eR.end};
}
const RAGC=[['head','neck',15],['neck','hip',32],['neck','eL',17],['eL','hL',17],['neck','eR',17],['eR','hR',17],
  ['hip','kL',22],['kL','fL',22],['hip','kR',22],['kR','fR',22],['head','hip',47,.25],['neck','kL',53,.08],['neck','kR',53,.08]];
function spawnRag(p,ivx,ivy,t){
  const pts=pose(p);
  for(const k in pts){const q=pts[k];q.ox=q.x-ivx*STEP*rnd(.75,1.25);q.oy=q.y-ivy*STEP*rnd(.75,1.25)}
  if(ball.carrier===p){ball.carrier=null;ball.vx=ivx*.4;ball.vy=-220}p.noCarry=.7;p.slide=0;p.charging=0;p.rag={pts};p.ragT=t;p.kickT=0;p.hitT=0;p.wantKick=0;p.wantHit=0;
}
function stepRag(p){
  const pts=p.rag.pts,g=2200*STEP*STEP;
  for(const k in pts){
    const q=pts[k],vx=(q.x-q.ox)*.994,vy=(q.y-q.oy)*.994;
    q.ox=q.x;q.oy=q.y;q.x+=vx;q.y+=vy+g;
  }
  for(let it=0;it<7;it++){
    for(const c of RAGC){
      const A=pts[c[0]],B=pts[c[1]];
      const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1e-4;
      const diff=(d-c[2])/d*.5*(c[3]||1);
      A.x+=dx*diff;A.y+=dy*diff;B.x-=dx*diff;B.y-=dy*diff;
    }
    for(const k in pts){
      const q=pts[k];
      if(q.y>GY-3){q.y=GY-3;q.ox=q.x-(q.x-q.ox)*.55}
      if(q.x<14){q.x=14;q.ox=q.x}
      if(q.x>W-14){q.x=W-14;q.ox=q.x}
    }
  }
}
function standUp(p,foe){
  const h=p.rag.pts.hip;
  p.x=clamp(h.x,30,W-30);p.y=GY;p.vx=0;p.vy=0;p.onG=true;p.rag=null;p.inv=1.3;
  p.kickT=0;p.hitT=0;

}
function stepPlayer(p,foe,dt){
  if(p.ragT>0){p.ragT-=dt;stepRag(p);if(p.ragT<=0)standUp(p,foe);return}
  if(p.inv>0)p.inv-=dt;if(p.bf.spd>0)p.bf.spd-=dt;if(p.bf.mag>0)p.bf.mag-=dt;if(p.bf.jmp>0)p.bf.jmp-=dt;if(p.bf.pow>0)p.bf.pow-=dt;if(p.bf.shd>0){p.bf.shd-=dt;p.inv=Math.max(p.inv,.1)}if(p.skillCd>0)p.skillCd-=dt;if(p.bf.stun>0){p.bf.stun-=dt;p.in.l=p.in.r=p.in.j=0;p.wantKick=p.wantHit=p.wantSkill=p.wantSlide=0}if(p.bf.frz>0){p.bf.frz-=dt;p.in.l=p.in.r=p.in.j=0;p.wantKick=p.wantHit=p.wantSkill=p.wantSlide=0}

  if(p.wantSkill){
    p.wantSkill=0;
    if(p.skillCd<=0&&p.dash<=0&&p.onG&&Math.abs(ball.x-p.x)<95&&ball.y>GY-120){
      const d=(foe.x-p.x)*p.face;
      p.dash=d>0&&d<330?Math.min(.62,(d+110)/640):.4;p.skillCd=15;p.vx=0;p.kickT=p.hitT=0;
      if(d>0&&d<330&&foe.ragT<=0)foe.bf.stun=p.dash+.5;

    }else if(p.side==='L'&&p.skillCd<=0)say('Topa yakın ol!',500);

function update(dt){
  if(!G||paused)return;
  if(G.on){if(G.on.role==='guest'){guestUpdate(dt);return}G.snT=(G.snT||0)+dt;if(G.snT>=.05){G.snT=0;sendSnap()}}

  const {me,ai}=G;

    G.stateT-=dt;

    if(c!==G.lastCount&&c>0&&c<=3){G.lastCount=c;say(String(c),700)}
    if(G.stateT<=0)afterGoalOrStart();

    return;
  }
  if(G.state==='goal'){
    G.goalT-=dt;
    G.slow=G.goalT>1.5?.45:1;
    if(G.goalT<=0){
      G.slow=1;
      if(G.ot){endMatch();return}
      resetKick();G.state='intro';G.stateT=1.9;G.lastCount=2;say('Hazır',900);updateHud(true);
      return;
    }
  }

  if(inp.kick){inp.kick=0;if(me.kickT<=0&&me.hitT<=0&&me.slide<=0&&me.ragT<=0){me.charging=1;me.charge=0}}
  if(me.charging){if(kh())me.charge=Math.min(1,me.charge+dt/.8);else{me.charging=0;me.wantKick=1;me.shotC=me.charge}}
  if(inp.hit){me.wantHit=1;inp.hit=0}
  if(inp.skill){me.wantSkill=1;inp.skill=0}if(inp.slide){me.wantSlide=1;inp.slide=0}
  if(G.state==='goal'){me.in.l=me.in.r=me.in.j=0}
  const sdt=dt*G.slow;
  if(G.state==='play'){if(G.on)hostRemote(ai,sdt);else aiThink(ai,me,sdt)}else{ai.in.l=ai.in.r=ai.in.j=0;if(G.rin){const r=G.rin;r.kc0=r.kc;r.hc0=r.hc;r.sc0=r.sc;r.lc0=r.lc}}
  stepPlayer(me,ai,sdt);stepPlayer(ai,me,sdt);stepKeeper(G.kL,sdt);stepKeeper(G.kR,sdt);
  for(const p of [me,ai])for(const k of [G.kL,G.kR]){const q=p.x-k.x;if(p.ragT<=0&&Math.abs(q)<30&&p.y>k.y-60)p.x=clamp(p.x+(q>=0?1:-1)*(30-Math.abs(q)),26,W-26)}
  // oyuncular birbirini iter
  if(me.ragT<=0&&ai.ragT<=0){
    const d=ai.x-me.x,ad=Math.abs(d);

      const push=(34-ad)/2*(d>=0?1:-1);
      me.x=clamp(me.x-push,26,W-26);ai.x=clamp(ai.x+push,26,W-26);
    }
  }
  pinned=false;
  stepBall(sdt);
  playerBall(me);playerBall(ai);keeperBall(G.kL);keeperBall(G.kR);carryBall();
  wallClamp();
  resolveKick(me);resolveKick(ai);
  if(ball.carrier&&G.state==='play')G[ball.carrier.side==='L'?'pL':'pR']+=dt;
  for(const p of [me,ai])if(p.bf.mag>0&&!ball.carrier&&p.ragT<=0){const q=p.x+p.face*30-ball.x;if(Math.abs(q)<420)ball.vx+=clamp(q*5,-700,700)*sdt}
  resolveHit(me,ai);resolveHit(ai,me);
  stepParts(sdt);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*28);
  if(G.state==='play'){
    stepOrb(dt);
    if(ball.x<GOALW&&ball.y>BARY+4)scoreGoal('R');
    else if(ball.x>W-GOALW&&ball.y>BARY+4)scoreGoal('L');
    if(G.state==='play'){
      if(!G.ot){
        G.clock+=dt;
        if(G.clock>=G.dur){
          if(G.sL!==G.sR)endMatch();
          else{G.ot=true;G.otT=30;say('Uzatma!',1200)}
        }
      }else{
        G.otT-=dt;
        if(G.otT<=0)endMatch();
      }
    }
    // top takılma koruması
    G.stuckT=ball.carrier?0:G.stuckT+dt;
    if(Math.hypot(ball.x-G.stuckX,ball.y-G.stuckY)>28){G.stuckT=0;G.stuckX=ball.x;G.stuckY=ball.y}
    else if(G.stuckT>4){ball.x=W/2;ball.y=140;ball.vx=ball.vy=0;G.stuckT=0;G.stuckX=ball.x;G.stuckY=ball.y}
  }
  updateHud(false);
}

function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(G&&mode==='play'&&!paused){
    acc+=dt;
    let n=0;
    while(acc>=STEP&&n<12){update(STEP);acc-=STEP;n++}
    if(n>=12)acc=0;
  }else if(G&&mode==='over'){
    acc+=dt;let n=0;while(acc>=STEP&&n<12){update(STEP);acc-=STEP;n++}
  }
  draw(dt);
}

/* ---------- boyut ---------- */
function resize(){
  const v=$('#view'),r=v.getBoundingClientRect();
  const vw=r.width,vh=r.height;
  if(vw<10||vh<10)return;
  const port=vw<vh*1.2;const cm=save.cam;VW=cm===0?820:W;VH=cm===2?H:H-40;camY=cm===2?0:40;
  let cw=Math.min(vw,vh*VW/VH),ch=cw*VH/VW;
  if(ch>vh){ch=vh;cw=ch*VW/VH}
  const room=vh-ch;
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.style.left=((vw-cw)/2)+'px';cv.style.top=(room>210?0:room/2)+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  SC=cv.width/VW;
  buildBg();
}
if(window.ResizeObserver)new ResizeObserver(resize).observe($('#view'));

  else if(a==='sbuy'){const k=b.dataset.k,lv=save.stad[k],cost=sdCost(lv);if(lv<5&&save.coins>=cost){save.coins-=cost;save.stad[k]=lv+1;persist();showMenu('stad')}}
  else if(a==='cc'){chatCur=b.dataset.c;showMenu('chat')}
  else if(a==='csend')sendChat();
  else if(a==='setname')doName();
  else if(a==='rename')showName();
  else if(a==='start'){sfx('whistle');try{if(matchMedia('(pointer:coarse)').matches){const de=document.documentElement;(de.requestFullscreen?de.requestFullscreen():Promise.reject()).then(()=>screen.orientation.lock('landscape')).catch(()=>{})}}catch(e){}showMenu('career')}
  else if(a==='online')showOnline();
  else if(a==='oconn')connectOnline();
  else if(a==='omake')showMake();
  else if(a==='ofind')showFind();
  else if(a==='ocreate')hostRoom(Math.min(10,Math.max(1,+b.dataset.m||3)));
  else if(a==='ojoin')joinRoom(String(b.dataset.c||''));
  else if(a==='ocancel'){leaveRoom();showOnline()}
  else if(a==='oleave'||a==='oexit'){leaveRoom();G=null;showOnline()}
  else if(a==='oclose')closeScreen();
  else if(a==='mbuy')buyPack(b.dataset.id);
  else if(a==='diff'){save.diff=clamp(+b.dataset.d||0,0,3);persist();showMenu('career')}
  else if(a==='col'){if(/^#[0-9a-f]{6}$/i.test(b.dataset.c)){save.col=b.dataset.c;persist();showMenu('card')}}
  else if(a==='mute'){muted=!muted;b.textContent=muted?'Sesi aç':'Sesi kapat'}
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='Emin misin? Tekrar dokun';setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent='İlerlemeyi sıfırla'},3000)}
    else{resetArmed=false;save=clone(DEF);persist();showMenu('career')}
  }
  else if(a==='resume')resumeGame();
  else if(a==='quit'){if(G&&mode==='pause'){paused=false;closeScreen();G.sL=0;G.sR=Math.max(3,G.sR+1);endMatch()}else showMenu('career')}
});

scr.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='cin'){e.preventDefault();sendChat()}else if(e.target.id==='nin'){e.preventDefault();doName()}});
window.__rfk={connectOnline,hostRoom,joinRoom,showOnline,startMatch,update,get G(){return G},ball,inp};
showIntro();
requestAnimationFrame(frame);
})();
</script>
