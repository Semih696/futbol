<style>
/* Düzen: gece stadyumu. Üstte skor şeridi, ortada 2:1 saha, altta parmak kontrolleri.
   Kariyer, antrenman ve sonuç ekranları sahanın üstüne açılan paneller. */
:root{
  --bg:#08130e;
  --panel:#10211a;
  --card:#162b21;
  --line:#2b4a3a;
  --fg:#eaf3ec;
  --mut:#8fae9d;
  --accent:#ffb627;
  --hot:#ff5a36;
  --good:#4ade80;
  --bad:#ff6b6b;
  --f-disp:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:#04080a}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;
  overflow:hidden;position:relative;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
button{font-family:inherit;color:inherit}
#app{
  height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px;
}
#hud{
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  padding:4px 0 6px;min-height:58px;
}
#hud[hidden]{display:none}
.side{min-width:0}
.side.r{text-align:right}
.tname{font-family:var(--f-disp);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:#0c1914;border:1px solid var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:100%;background:var(--good);transition:width .12s linear}
.side.r .bar i{margin-left:auto;background:var(--hot)}
.mid{text-align:center;line-height:1}
#score{font-family:var(--f-disp);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#clock{font-family:var(--f-disp);font-weight:500;font-size:13px;color:var(--accent);letter-spacing:.1em;font-variant-numeric:tabular-nums;margin-top:3px}
#pauseBtn{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(8,19,14,.6);display:flex;align-items:center;justify-content:center;gap:5px;z-index:2}
#pauseBtn[hidden]{display:none}

#view{flex:1;min-height:0;position:relative}
#cv{position:absolute;display:block;background:#04080a}
#banner{
  position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;
  font-family:var(--f-disp);font-weight:700;font-size:clamp(44px,13vw,110px);line-height:1;
  color:var(--accent);text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 40px rgba(255,182,39,.35);

}
#banner.show{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.08)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
#banner.hold{animation:none;opacity:1}
#pad{
  position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  pointer-events:none;padding-bottom:6px;gap:8px;
}
#pad[hidden]{display:none}
#joy{pointer-events:auto;position:relative;width:132px;height:132px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(16,33,26,.72);touch-action:none}
#jk{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,182,39,.55);border:2px solid var(--accent);pointer-events:none}
.grp{display:flex;gap:10px;align-items:flex-end}
.pb{

  background:rgba(16,33,26,.72);color:var(--fg);font-family:var(--f-disp);font-weight:500;font-size:15px;

/* paneller */

.up .n{font-family:var(--f-disp);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.up .d{color:var(--mut);font-size:14px}
.pips{display:flex;gap:4px;grid-column:1/-1}
.pips i{flex:1;height:7px;border-radius:3px;background:#0c1914;border:1px solid var(--line)}
.pips i.f{background:var(--accent);border-color:var(--accent)}
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.res .big{font-family:var(--f-disp);font-weight:700;font-size:clamp(54px,18vw,84px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.res .win{color:var(--good)}.res .lose{color:var(--bad)}.res .draw{color:var(--accent)}
.stars{font-size:34px;letter-spacing:.2em;color:var(--accent)}
.stars s{text-decoration:none;color:#35503f}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:17px}
.sum span:nth-child(even){font-family:var(--f-disp);font-weight:500;color:var(--accent);text-align:right}
.hint{color:var(--mut);font-size:14px;line-height:1.4;margin:0}
.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:14px;padding:8px 0}

input{-webkit-user-select:text;user-select:text;touch-action:auto}

/* ---------- ses (WebAudio ile gerçekçi stadyum sesleri + spiker) ---------- */
let AC=null,muted=false,MG=null,NB=null,amb=null,lastSay=0;const lastSfx={};
const NETSFX=['kick','hit','whistle','post','save'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function audio(){
  if(AC)return AC;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  AC=new C();
  const cp=AC.createDynamicsCompressor();cp.threshold.value=-12;cp.knee.value=10;cp.ratio.value=8;cp.attack.value=.002;cp.release.value=.2;
  MG=AC.createGain();MG.gain.value=.9;MG.connect(cp);cp.connect(AC.destination);
  const n=AC.sampleRate*2;NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  return AC;
}
function env(g,T,a,dur,vol){g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),T+a);g.gain.exponentialRampToValueAtTime(.0001,T+dur)}
function tone(f1,f2,dur,type,vol,delay,att){
  const T=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,T);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),T+dur);
  env(g,T,att||.003,dur,vol);o.connect(g);g.connect(MG);o.start(T);o.stop(T+dur+.03);
}
function noise(dur,ft,f1,f2,q,vol,delay,att){
  const T=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;s.loop=true;f.type=ft;f.Q.value=q||1;
  f.frequency.setValueAtTime(f1,T);f.frequency.exponentialRampToValueAtTime(Math.max(30,f2),T+dur);
  env(g,T,att||.004,dur,vol);s.connect(f);f.connect(g);g.connect(MG);s.start(T,Math.random()*1.5);s.stop(T+dur+.05);
}
/* hakem düdüğü: bezelye düdük, titreşimli */
function whistle(dur,delay,vol){
  const T=AC.currentTime+(delay||0),g=AC.createGain(),lf=AC.createOscillator(),lg=AC.createGain();
  lf.frequency.value=32;lg.gain.value=150;lf.connect(lg);
  g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(vol,T+.03);g.gain.setValueAtTime(vol,T+Math.max(.04,dur-.06));g.gain.linearRampToValueAtTime(.0001,T+dur);
  for(const f of [2780,2845]){
    const o=AC.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(f-80,T);o.frequency.linearRampToValueAtTime(f+60,T+.07);o.frequency.linearRampToValueAtTime(f,T+dur);
    lg.connect(o.frequency);o.connect(g);o.start(T);o.stop(T+dur+.03);

  const s=AC.createBufferSource(),bf=AC.createBiquadFilter(),ng=AC.createGain();
  s.buffer=NB;s.loop=true;bf.type='bandpass';bf.frequency.value=3300;bf.Q.value=4;ng.gain.value=vol*.9;
  s.connect(bf);bf.connect(ng);ng.connect(g);s.start(T,Math.random());s.stop(T+dur+.03);
  g.connect(MG);lf.start(T);lf.stop(T+dur+.03);
}
/* tribün uğultusu: çok kişilik, dalgalı */
function crowd(dur,vol,delay){
  const T=AC.currentTime+(delay||0);
  for(const [f,q,k] of [[420,.6,1],[900,.7,.8],[1700,.9,.45],[220,.5,.7]]){
    const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
    s.buffer=NB;s.loop=true;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;
    g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(vol*k,T+.5);g.gain.setValueAtTime(vol*k,T+dur*.45);g.gain.exponentialRampToValueAtTime(.0001,T+dur);
    l.frequency.value=5+Math.random()*3;lg.gain.value=vol*k*.25;l.connect(lg);lg.connect(g.gain);
    s.connect(fl);fl.connect(g);g.connect(MG);s.start(T,Math.random()*1.5);s.stop(T+dur+.05);l.start(T);l.stop(T+dur+.05);
  }
}
function horn(delay){
  for(const f of [233,311,466]){
    const T=AC.currentTime+(delay||0),o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(f,T);o.frequency.linearRampToValueAtTime(f*.98,T+.9);
    fl.type='lowpass';fl.frequency.value=1800;
    g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(.11,T+.04);g.gain.setValueAtTime(.11,T+.7);g.gain.linearRampToValueAtTime(.0001,T+.95);
    o.connect(fl);fl.connect(g);g.connect(MG);o.start(T);o.stop(T+1);
  }
}
function clap(n,delay){for(let i=0;i<n;i++){const d=(delay||0)+i*.21+(i%3===2?.06:0);noise(.07,'bandpass',1900,1300,1.1,.3,d,.002);noise(.05,'highpass',3500,2800,.7,.12,d,.001)}}
function sfx(t,v){
  if(G&&G.on&&G.on.role==='host'&&G.on.room&&NETSFX.includes(t))G.on.room.emit('ev',{k:'s',n:t,v:+(v||0)}).catch(()=>{});
  if(muted)return;
  try{
    if(!audio())return;
    if(AC.state==='suspended')AC.resume();
    const now=AC.currentTime;if(lastSfx[t]&&now-lastSfx[t]<.035)return;lastSfx[t]=now;
    if(t==='kick'){
      const p=clamp(v||.9,.45,1.6),r=.9+Math.random()*.2;
      tone(200*r,46,.2,'sine',1*p,0,.002);              /* top gövdesi: "pup" */
      noise(.11,'lowpass',1200*r,240,.7,.9*p,0,.002);   /* deri darbesi */
      noise(.035,'bandpass',3500,2200,.9,.5*p,0,.001);  /* sert vuruş çıtırtısı */
      if(p>1.1)tone(115,38,.32,'sine',.55,0,.003);      /* güçlü şutta derin gümbürtü */
    }
    else if(t==='hit'){tone(150,38,.22,'sine',.8,0,.002);noise(.12,'lowpass',900,200,.8,.8,0,.002);noise(.04,'highpass',2200,1800,.8,.3,0,.001)}
    else if(t==='swing')noise(.16,'bandpass',500,2200,1.2,.16,0,.06);
    else if(t==='jump'){noise(.09,'bandpass',1400,700,.9,.14,0,.01);tone(130,70,.09,'sine',.25,0,.004)}
    else if(t==='bounce'){const p=clamp(v||.5,.2,1);tone(125,52,.12,'sine',.55*p,0,.002);noise(.07,'lowpass',800,250,.8,.45*p,0,.002)}
    else if(t==='post'){tone(940,900,.55,'sine',.4,0,.001);tone(1410,1380,.4,'sine',.22,0,.001);tone(2250,2200,.25,'sine',.1,0,.001);noise(.05,'bandpass',3200,2800,2,.4,0,.001)}
    else if(t==='save'){noise(.07,'bandpass',2200,1400,1,.55,0,.001);tone(170,60,.14,'sine',.7,0,.002);noise(.1,'lowpass',700,250,.8,.5,0,.002)}
    else if(t==='whistle')whistle(.55,0,.2);
    else if(t==='goal'){noise(.3,'highpass',2500,6500,.7,.3,0,.03);horn(.05);clap(7,1.1)}

}

  else if(a==='diff'){save.diff=clamp(+b.dataset.d||0,0,3);persist();showMenu('career')}
  else if(a==='col'){if(/^#[0-9a-f]{6}$/i.test(b.dataset.c)){save.col=b.dataset.c;persist();showMenu('card')}}
  else if(a==='mute'){muted=!muted;if(muted)killVoice();b.textContent=muted?'Sesi aç':'Sesi kapat'}
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='Emin misin? Tekrar dokun';setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent='İlerlemeyi sıfırla'},3000)}
    else{resetArmed=false;save=clone(DEF);persist();showMenu('career')}
  }
  else if(a==='resume')resumeGame();
  else if(a==='quit'){if(G&&mode==='pause'){paused=false;closeScreen();G.sL=0;G.sR=Math.max(3,G.sR+1);endMatch()}else showMenu('career')}
});

try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}

(function(){const d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;display:none;gap:8px';
d.innerHTML='<button class="btn sm" id="rpS">🐢 Yavaş</button><button class="btn sm" id="rpV">💾 Kaydet</button><button class="btn sm" id="rpP">📤 Paylaş</button>';document.body.appendChild(d);
let rec=null,ch=[];
d.querySelector('#rpS').onclick=()=>{if(G){G.rpSlow=!G.rpSlow;d.querySelector('#rpS').textContent=G.rpSlow?'⏩ Normal':'🐢 Yavaş'}};
d.querySelector('#rpP').onclick=async()=>{const tx='Maçta gol attım! ⚽ '+(G?G.sL+'-'+G.sR:'');try{if(navigator.share)await navigator.share({title:'Gol!',text:tx});else{await navigator.clipboard.writeText(tx);say('Kopyalandı',900)}}catch(e){}};
d.querySelector('#rpV').onclick=()=>{if(rec||!window.MediaRecorder)return;try{const st=cv.captureStream(30);rec=new MediaRecorder(st);ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.download='gol-tekrari.webm';a.click();rec=null};rec.start();d.querySelector('#rpV').textContent='⏺ Kaydediliyor'}catch(e){rec=null}};
setInterval(()=>{const on=!!(G&&G.rp);d.style.display=on?'flex':'none';if(!on&&rec&&rec.state==='recording'){rec.stop();d.querySelector('#rpV').textContent='💾 Kaydet'}},150)})();
})();
